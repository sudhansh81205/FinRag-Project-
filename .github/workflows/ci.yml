name: FinRAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pydantic python-dotenv pyyaml requests langchain-text-splitters

    - name: Code Quality & Linting (Ruff)
      run: |
        ruff check .

    - name: Run Unit Tests (Pytest)
      run: |
        pytest -v
