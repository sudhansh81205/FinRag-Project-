name: FinRAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Code Quality & Linting (Ruff)
      run: |
        ruff check .

    - name: Run Unit Tests (Pytest)
      run: |
        pytest -v

    - name: Verify frozen candidate chart split and asset integrity
      run: python scripts/verify_chart_set.py

    - name: Check setup entry point without data or credentials
      run: python app.py --check

    - name: Verify existing parser and environment smoke (not final pipeline readiness)
      env:
        DVC_NO_ANALYTICS: "1"
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
        GRADIO_ANALYTICS_ENABLED: "False"
      run: |
        python scripts/parse_filing.py
        python scripts/prepare_evidence.py
        python scripts/verify_day05_environment.py
        python scripts/verify_canonical_data.py

    - name: Preserve environment diagnostic and local smoke artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: environment-smoke
        path: |
          output/chart-set-verification.json
          output/environment/
          output/shanay/
        if-no-files-found: warn
